<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Online Table</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111413'/%3E%3Crect x='15' y='8' width='34' height='48' rx='4' fill='%23262d29' stroke='%23d7c7a5' stroke-opacity='.45' stroke-width='2'/%3E%3Ccircle cx='32' cy='31' r='10' fill='none' stroke='%23d7c7a5' stroke-opacity='.5' stroke-width='2'/%3E%3Cpath d='M25 38h14M24 24h16' stroke='%23d7c7a5' stroke-opacity='.45' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles/base.css?v=20260629-4" />
    <link rel="stylesheet" href="./styles/lobby.css?v=20260701-2" />
    <link rel="stylesheet" href="./styles/topbar.css?v=20260630-2" />
    <link rel="stylesheet" href="./styles/panels.css?v=20260629-4" />
    <link rel="stylesheet" href="./styles/table.css?v=20260629-4" />
    <link rel="stylesheet" href="./styles/cards.css?v=20260630-4" />
    <link rel="stylesheet" href="./styles/dialogs.css?v=20260629-4" />
    <link rel="stylesheet" href="./styles/responsive.css?v=20260701-1" />
  </head>
  <body>
    <section id="lobby" class="lobby-screen"></section>

    <div id="app" class="app-shell" hidden>
      <header class="topbar">
        <details class="top-drawer">
          <summary>
            <span class="mark">MTG</span>
            <span>牌桌控制</span>
          </summary>
          <div class="top-controls">
            <div class="session-tools">
              <div class="table-timer" aria-label="牌桌计时器">
                <strong id="tableTimer">00:00</strong>
                <button id="timerToggle" type="button">开始</button>
                <button id="timerReset" type="button">归零</button>
              </div>
              <div id="syncStatus" class="sync-status" data-status="connecting">正在连接</div>
              <div class="session-actions">
                <button id="seatToggle" type="button">视角：P1</button>
                <button id="resetGame" type="button">重置牌桌</button>
                <button id="leaveTable" type="button">返回大厅</button>
              </div>
              <div class="random-tools">
                <button id="flipCoin" type="button">硬币</button>
                <button id="rollD6" type="button">D6</button>
                <button id="rollD20" type="button">D20</button>
              </div>
              <div class="top-import">
                <textarea id="deckImport" placeholder="导入牌表，例如：4 Lightning Bolt&#10;8 Island"></textarea>
                <button id="importDeckTop" type="button">导入并洗牌</button>
              </div>
            </div>
            <div id="lookupDock" class="lookup-panel dockable-panel" data-dock-id="lookup">
              <div class="dock-handle" data-dock-handle aria-label="拖动查询面板" title="拖动查询"></div>
              <div class="lookup-row">
                <input id="lookupInput" type="search" placeholder="查牌名、机制，或 翻译: trample" />
                <button id="lookupButton" type="button">搜索</button>
              </div>
              <div id="lookupOutput" class="lookup-output">输入牌名或机制</div>
            </div>
            <div id="chatDock" class="chat-dock dockable-panel" data-dock-id="chat">
              <div class="dock-handle" data-dock-handle aria-label="拖动聊天面板" title="拖动聊天"></div>
              <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
              <form id="chatForm" class="chat-form">
                <input id="chatInput" type="text" maxlength="160" placeholder="发送聊天" autocomplete="off" />
                <button type="submit">发送</button>
              </form>
            </div>
            <div id="logDock" class="log-dock dockable-panel" data-dock-id="log">
              <div class="dock-handle" data-dock-handle aria-label="拖动日志面板" title="拖动日志"></div>
              <div id="logPanel" class="log-panel"></div>
            </div>
          </div>
        </details>
      </header>

      <main class="table" aria-live="polite">
        <section id="opponentArea" class="player-area opponent"></section>
        <section id="battlefieldArea" class="battlefield-area"></section>
        <section id="selfArea" class="player-area self"></section>
      </main>
    </div>

    <dialog id="zoneDialog" class="zone-dialog">
      <div class="dialog-head">
        <div>
          <h2 id="zoneTitle"></h2>
          <p id="zoneMeta"></p>
        </div>
        <button id="closeZone" type="button" aria-label="关闭">X</button>
      </div>
      <div id="zoneCards" class="zone-cards"></div>
    </dialog>

    <dialog id="cardDialog" class="card-dialog">
      <div id="cardDetail"></div>
    </dialog>

    <dialog id="libraryMoveDialog" class="library-move-dialog">
      <div class="dialog-head">
        <div>
          <h2 id="libraryMoveTitle">移到牌库</h2>
          <p id="libraryMoveMeta"></p>
        </div>
        <button type="button" aria-label="取消" data-library-destination="">X</button>
      </div>
      <div class="library-move-options">
        <button type="button" data-library-destination="library-top">牌库顶</button>
        <button type="button" data-library-destination="library-bottom">牌库底</button>
        <button type="button" data-library-destination="library-random">洗入牌库</button>
        <button type="button" class="library-move-cancel" data-library-destination="">取消</button>
      </div>
    </dialog>

    <script src="./src/constants.js?v=20260621-13"></script>
    <script src="./src/lobby-view.js?v=20260701-1"></script>
    <script src="./src/sync-lobby.js?v=20260621-13"></script>
    <script src="./src/state.js?v=20260621-13"></script>
    <script src="./src/render.js?v=20260621-13"></script>
    <script src="./src/actions-drag.js?v=20260630-1"></script>
    <script src="./src/dockable-panels.js?v=20260629-2"></script>
    <script src="./src/zones-cards.js?v=20260630-1"></script>
    <script src="./src/lookup-init.js?v=20260621-13"></script>
  </body>
</html>
