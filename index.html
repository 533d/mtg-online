<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Online Table</title>
    <link rel="stylesheet" href="./styles/base.css?v=20260621-5" />
    <link rel="stylesheet" href="./styles/lobby.css?v=20260621-5" />
    <link rel="stylesheet" href="./styles/topbar.css?v=20260621-5" />
    <link rel="stylesheet" href="./styles/panels.css?v=20260621-5" />
    <link rel="stylesheet" href="./styles/table.css?v=20260621-5" />
    <link rel="stylesheet" href="./styles/cards.css?v=20260621-5" />
    <link rel="stylesheet" href="./styles/dialogs.css?v=20260621-5" />
    <link rel="stylesheet" href="./styles/responsive.css?v=20260621-5" />
  </head>
  <body>
    <section id="lobby" class="lobby-screen">
      <div class="lobby-card">
        <div class="lobby-head">
          <span class="mark">MTG</span>
          <div>
            <h1>选择牌桌</h1>
            <p>创建一个牌桌，或输入牌桌号加入正在进行的对局。</p>
          </div>
        </div>

        <div class="lobby-grid">
          <form id="createTableForm" class="lobby-panel">
            <h2>创建牌桌</h2>
            <input id="createTableId" type="text" maxlength="24" placeholder="牌桌号，留空自动生成" autocomplete="off" />
            <input id="createTablePassword" type="password" placeholder="密码，可为空" autocomplete="new-password" />
            <button type="submit">创建并进入</button>
          </form>

          <form id="searchTableForm" class="lobby-panel">
            <h2>查找牌桌</h2>
            <div class="lobby-search-row">
              <input id="tableSearchInput" type="search" placeholder="输入牌桌号" autocomplete="off" />
              <button type="submit">查询</button>
            </div>
            <button id="refreshTables" type="button">刷新大厅</button>
          </form>
        </div>

        <div id="lobbyMessage" class="lobby-message" role="status"></div>
        <div id="tableList" class="table-list" aria-live="polite"></div>
      </div>
    </section>

    <div id="app" class="app-shell" hidden>
      <header class="topbar">
        <details class="top-drawer">
          <summary>
            <span class="mark">MTG</span>
            <span>牌桌控制</span>
          </summary>
          <div class="top-controls">
            <div class="session-tools">
              <div class="table-timer" aria-label="牌桌计时器">
                <strong id="tableTimer">00:00</strong>
                <button id="timerToggle" type="button">开始</button>
                <button id="timerReset" type="button">归零</button>
              </div>
              <div id="syncStatus" class="sync-status" data-status="connecting">正在连接</div>
              <div class="session-actions">
                <button id="seatToggle" type="button">视角：P1</button>
                <button id="resetGame" type="button">重置牌桌</button>
                <button id="leaveTable" type="button">返回大厅</button>
              </div>
              <div class="random-tools">
                <button id="flipCoin" type="button">硬币</button>
                <button id="rollD6" type="button">D6</button>
                <button id="rollD20" type="button">D20</button>
              </div>
            </div>
            <div class="top-import">
              <textarea id="deckImport" placeholder="导入牌表，例如：4 Lightning Bolt&#10;8 Island"></textarea>
              <button id="importDeckTop" type="button">导入并洗牌</button>
            </div>
            <div class="lookup-panel">
              <div class="lookup-row">
                <input id="lookupInput" type="search" placeholder="查牌名、机制，或 翻译: trample" />
                <button id="lookupButton" type="button">搜索</button>
              </div>
              <div id="lookupOutput" class="lookup-output">输入牌名或机制</div>
            </div>
            <div id="logPanel" class="log-panel"></div>
          </div>
        </details>
      </header>

      <main class="table" aria-live="polite">
        <section id="opponentArea" class="player-area opponent"></section>
        <section id="battlefieldArea" class="battlefield-area"></section>
        <section id="selfArea" class="player-area self"></section>
      </main>
    </div>

    <dialog id="zoneDialog" class="zone-dialog">
      <div class="dialog-head">
        <div>
          <h2 id="zoneTitle"></h2>
          <p id="zoneMeta"></p>
        </div>
        <button id="closeZone" type="button" aria-label="关闭">X</button>
      </div>
      <div id="zoneCards" class="zone-cards"></div>
    </dialog>

    <dialog id="cardDialog" class="card-dialog">
      <div id="cardDetail"></div>
    </dialog>

    <dialog id="libraryMoveDialog" class="library-move-dialog">
      <div class="dialog-head">
        <div>
          <h2 id="libraryMoveTitle">移到牌库</h2>
          <p id="libraryMoveMeta"></p>
        </div>
        <button type="button" aria-label="取消" data-library-destination="">X</button>
      </div>
      <div class="library-move-options">
        <button type="button" data-library-destination="library-top">牌库顶</button>
        <button type="button" data-library-destination="library-bottom">牌库底</button>
        <button type="button" data-library-destination="library-random">洗入牌库</button>
        <button type="button" class="library-move-cancel" data-library-destination="">取消</button>
      </div>
    </dialog>

    <script src="./src/constants.js?v=20260621-5"></script>
    <script src="./src/sync-lobby.js?v=20260621-5"></script>
    <script src="./src/state.js?v=20260621-5"></script>
    <script src="./src/render.js?v=20260621-5"></script>
    <script src="./src/actions-drag.js?v=20260621-5"></script>
    <script src="./src/zones-cards.js?v=20260621-5"></script>
    <script src="./src/lookup-init.js?v=20260621-5"></script>
  </body>
</html>
